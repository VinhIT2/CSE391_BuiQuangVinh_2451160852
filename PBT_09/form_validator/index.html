<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Form Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>Đăng Ký Tài Khoản</h2>
        <form id="regForm">
            <div class="form-group">
                <label>Họ và tên</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="Nhập từ 2-50 ký tự">
                    <span class="status-icon"></span>
                </div>
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <input type="text" id="email" placeholder="example@domain.com">
                    <span class="status-icon"></span>
                </div>
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Nhập mật khẩu">
                    <span class="status-icon"></span>
                </div>
                <div class="strength-meter"><div id="strengthBar"></div></div>
                <small id="strengthText"></small>
            </div>

            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu">
                    <span class="status-icon"></span>
                </div>
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label>Số điện thoại</label>
                <div class="input-wrapper">
                    <input type="text" id="phone" placeholder="0901-234-567">
                    <span class="status-icon"></span>
                </div>
                <small class="error-msg"></small>
            </div>

            <button type="submit" id="submitBtn" disabled>Đăng ký</button>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
