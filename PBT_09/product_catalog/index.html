<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h2>TechStore</h2>
        <div class="nav-controls">
            <button id="themeToggle">🌓 Mode</button>
            <div class="cart-icon">🛒 <span id="cartBadge">0</span></div>
        </div>
    </header>

    <div class="container">
        <aside class="toolbar">
            <input type="text" id="searchBar" placeholder="Tìm sản phẩm...">
            <select id="sortSelect">
                <option value="default">Sắp xếp</option>
                <option value="price-asc">Giá tăng dần</option>
                <option value="price-desc">Giá giảm dần</option>
                <option value="name-asc">Tên A-Z</option>
                <option value="rating-desc">Đánh giá cao nhất</option>
            </select>
            <div id="categoryFilters" class="categories">
                <button class="cat-btn active" data-cat="all">Tất cả</button>
                <button class="cat-btn" data-cat="phone">Điện thoại</button>
                <button class="cat-btn" data-cat="laptop">Laptop</button>
                <button class="cat-btn" data-cat="tablet">Máy tính bảng</button>
                <button class="cat-btn" data-cat="audio">Âm thanh</button>
            </div>
        </aside>

        <main id="productGrid" class="grid"></main>
    </div>

    <div id="productModal" class="modal hidden"></div>

    <script src="app.js"></script>
</body>
</html>
