<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <h1>Task Manager</h1>
        <form id="todoForm">
            <input id="todoInput" type="text" placeholder="What needs to be done?" autocomplete="off">
            <button type="submit">Add</button>
        </form>
        
        <ul id="todoList"></ul>

        <div class="footer-controls">
            <span id="todoCount">0 items left</span>
            <div class="filters">
                <button id="filterAll" class="filter-btn active" data-filter="all">All</button>
                <button id="filterActive" class="filter-btn" data-filter="active">Active</button>
                <button id="filterCompleted" class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <button id="clearCompletedBtn">Clear Completed</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
